# ============================================================================
# TalkFlow Redis Production/Dev Configuration
# Tailored for High-Throughput Pub/Sub and Ephemeral Presence Tracking
# ============================================================================

# Network & Security
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence: AOF enabled for reliability, RDB snapshotting as fallback
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
# volatile-lru ensures keys with an expiration (presence TTL, typing TTL, translation cache)
# are evicted first under memory pressure without corrupting active pub/sub channels.
maxmemory 512mb
maxmemory-policy volatile-lru

# Client Connection Limits
maxclients 10000

# Logging
loglevel notice
