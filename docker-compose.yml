version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # TalkFlow Primary Database: PostgreSQL 16
  # Stores user profiles, friendships, messages (with per-conversation seq),
  # devices/sessions, and attachments.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: talkflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talkflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talkflow_secret_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-talkflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - talkflow-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talkflow_admin} -d ${POSTGRES_DB:-talkflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # TalkFlow Real-Time Cache, Presence & Pub/Sub: Redis 7
  # Handles ephemeral online status (TTL 60s), typing indicators (TTL 5s),
  # rate-limiting buckets, and multi-gateway message fanout.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: talkflow-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-talkflow_redis_secret_pass_2026}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - talkflow-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-talkflow_redis_secret_pass_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
    name: talkflow_postgres_data
    driver: local
  redis_data:
    name: talkflow_redis_data
    driver: local

networks:
  talkflow-internal:
    name: talkflow-net
    driver: bridge
